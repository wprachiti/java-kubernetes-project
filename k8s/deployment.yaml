
apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-kubernetes-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: java-kubernetes-app
  template:
    metadata:
      labels:
        app: java-kubernetes-app
    spec:
      containers:
        - name: java-kubernetes-app
          image: wprachiti/java-kubernetes-project:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
